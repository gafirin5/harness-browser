name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install terminal host
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run verify

  ui-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install terminal host and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          if command -v google-chrome-stable >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            echo "Chrome tidak ditemukan"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Start runtime
        env:
          DATA_DIR: /tmp/dorado-ci
          ADMIN_PASSWORD: ci-password-123
          PUBLIC_BASE_URL: http://127.0.0.1:7788
          COOKIE_SECURE: 'false'
          NODE_ENV: development
        run: |
          nohup node apps/runtime/dist/server.js > /tmp/dorado-runtime.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7788/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dorado-runtime.log
          exit 1
      - name: Chrome UI smoke
        env:
          BASE_URL: http://127.0.0.1:7788
          DORADO_PASSWORD: ci-password-123
        run: node scripts/e2e-chrome93.mjs