services:
  postgres:
    image: postgres:16
    container_name: orca-postgres
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
      POSTGRES_DB: orca
    ports:
      - '5432:5432'
    volumes:
      - orca-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orca -d orca']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orca-pgdata: